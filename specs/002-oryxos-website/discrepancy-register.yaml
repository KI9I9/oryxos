schema_version: 2
feature: 002-oryxos-website
feature_mode: local-visual-prototype
public_deployment_allowed: false
prototype_rules:
  - Use neutral copy or a visible draft label for unresolved content.
  - Do not present unverified commands, endpoints, or capabilities as available.
  - Use the four capability states only in the non-claim visual legend; do not assign them to real capabilities.
  - Resolve all blocking entries in a later content-and-publication feature before public deployment.

discrepancies:
  - discrepancy_id: DISC-POSITIONING-001
    category: positioning
    observed_fact: Existing repository prose describes a mature distributed Agent OS, while the verified project is an early runtime skeleton.
    affected_routes: [home, architecture, roadmap, docs-what-is-oryxos]
    prototype_handling: neutral-copy
    public_deployment_blocked: true
    status: open
    required_action: Align README, roadmap, authoritative documents, and final website positioning before publication.

  - discrepancy_id: DISC-MATURITY-001
    category: maturity
    observed_fact: Final public maturity wording has not been reconciled across repository documents and release evidence.
    affected_routes: [home, docs-project-status, roadmap]
    prototype_handling: draft-label
    public_deployment_blocked: true
    status: open
    required_action: Establish and approve one maturity statement for all authoritative surfaces.

  - discrepancy_id: DISC-VERSION-001
    category: version
    observed_fact: Repository version identifiers and the version appropriate for public website copy have not been reconciled.
    affected_routes: [docs-project-status, docs-build-from-source]
    prototype_handling: omit-detail
    public_deployment_blocked: true
    status: open
    required_action: Verify the release baseline and synchronize version references before publication.

  - discrepancy_id: DISC-CLI-001
    category: cli
    observed_fact: Existing prose describes init, chat, serve, and additional subcommands, while the current CLI source only exposes help behavior.
    affected_routes: [docs-cli, docs-build-from-source]
    prototype_handling: draft-label
    public_deployment_blocked: true
    status: open
    required_action: Verify each CLI behavior and replace prototype placeholders with evidence-backed documentation.

  - discrepancy_id: DISC-API-001
    category: api
    observed_fact: Existing prose and comments refer to business REST endpoints, while the current source does not verify those interfaces.
    affected_routes: [docs-rest-api, architecture]
    prototype_handling: draft-label
    public_deployment_blocked: true
    status: open
    required_action: Verify controller implementations and publish only released endpoints.

  - discrepancy_id: DISC-CAPABILITY-001
    category: capability
    observed_fact: Provider, ReAct Loop, Tool, Memory, MCP, and distributed behavior require atomic source and release verification.
    affected_routes: [home, architecture, roadmap, docs-provider, docs-react-loop, docs-tool, docs-memory, docs-skill-profile]
    prototype_handling: draft-label
    public_deployment_blocked: true
    status: open
    required_action: Build a Constitution-compliant claim and evidence baseline in the publication feature.

  - discrepancy_id: DISC-BUILD-001
    category: build
    observed_fact: Existing build and run instructions may describe workflows that have not been verified against a released artifact.
    affected_routes: [docs-build-from-source, docs-cli]
    prototype_handling: omit-detail
    public_deployment_blocked: true
    status: open
    required_action: Reproduce build and runtime workflows against an approved source and release baseline.

  - discrepancy_id: DISC-ASSET-001
    category: asset
    observed_fact: Existing authoritative documents reference retired website asset paths that will not exist in the new site.
    affected_routes: [home, architecture]
    prototype_handling: neutral-copy
    public_deployment_blocked: true
    status: open
    required_action: Update authoritative asset references when the new brand set is approved for publication.

  - discrepancy_id: DISC-DEPLOYMENT-001
    category: deployment
    observed_fact: The automatic Pages workflow was removed and replaced by read-only validation and ordinary artifact workflows pinned through website/.nvmrc.
    affected_routes: [home]
    prototype_handling: resolved
    public_deployment_blocked: false
    status: resolved
    required_action: Design any future protected public deployment in a separate content-and-publication feature.

  - discrepancy_id: DISC-GOVERNANCE-001
    category: governance
    observed_fact: Public content requires authoritative-document consistency that is intentionally outside this visual prototype.
    affected_routes: [home, architecture, roadmap, docs-index]
    prototype_handling: draft-label
    public_deployment_blocked: true
    status: open
    required_action: Complete content reconciliation and formal publication review in a separate feature.
