  <circle cx="500" cy="300" r="96" fill="#145ee8"/>
  <text x="454" y="288" fill="#dce7ff" font-family="monospace" font-size="13" font-weight="700">RUNTIME</text>
  <text x="451" y="325" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Kernel</text>

