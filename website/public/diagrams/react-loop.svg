  <text x="431" y="437" fill="#8d571c" font-family="monospace" font-size="12">03</text>
  <text x="431" y="465" fill="#12211f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Bounded action</text>

  <rect x="106" y="259" width="190" height="82" fill="#e7f3f0" stroke="#087f71"/>
  <text x="132" y="290" fill="#087f71" font-family="monospace" font-size="12">04</text>
  <text x="132" y="318" fill="#12211f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Result</text>

