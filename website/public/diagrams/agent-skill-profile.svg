<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title description">
  <title id="title">Profile-defined Agent and referenced Skill</title>
  <desc id="description">One YAML Profile completely defines an Agent and may reference a Skill loaded as behavioral prompt context.</desc>
  <rect width="1000" height="520" fill="#f4f3ed"/>
  <rect x="36" y="36" width="928" height="448" fill="#ffffff" stroke="#12211f" stroke-width="2"/>
  <text x="68" y="78" fill="#087f71" font-family="monospace" font-size="15" font-weight="700" letter-spacing="2">AGENT DEFINITION / CONSTITUTION-ALIGNED VISUAL</text>

  <rect x="80" y="135" width="280" height="230" fill="#145ee8"/>
  <text x="110" y="174" fill="#dce7ff" font-family="monospace" font-size="14" font-weight="700">01 / COMPLETE DEFINITION</text>
  <text x="110" y="229" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">YAML Profile</text>
  <text x="110" y="274" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21">completely defines</text>
  <text x="110" y="310" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">one Agent</text>

  <path d="M360 250h120" stroke="#12211f" stroke-width="4"/>
  <path d="M464 238l18 12-18 12" fill="none" stroke="#12211f" stroke-width="4"/>
  <circle cx="562" cy="250" r="80" fill="#e9ece8" stroke="#12211f" stroke-width="3"/>
  <text x="523" y="240" fill="#087f71" font-family="monospace" font-size="13" font-weight="700">AGENT</text>
  <rect x="537" y="261" width="50" height="50" fill="#087f71"/>

  <path d="M246 365v62h486v-62" fill="none" stroke="#d8672f" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="696" y="135" width="220" height="230" fill="#fff3e8" stroke="#d8672f" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="724" y="174" fill="#8d571c" font-family="monospace" font-size="14" font-weight="700">02 / MAY REFERENCE</text>
  <text x="724" y="229" fill="#12211f" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Skill</text>
  <text x="724" y="268" fill="#53615e" font-family="Arial, Helvetica, sans-serif" font-size="18">behavioral instructions</text>
  <text x="724" y="298" fill="#53615e" font-family="Arial, Helvetica, sans-serif" font-size="18">loaded as prompt context</text>
  <text x="724" y="334" fill="#8d571c" font-family="monospace" font-size="13" font-weight="700">NOT AN EXECUTABLE TOOL</text>
</svg>
